# FarmersDelight 配置
# 常用选项排在前面。GUI 布局、按钮和贴图请编辑 gui.yml。
# 物品 ID 支持 CraftEngine 物品和原版物品，例如 farmersdelight:flint_knife、minecraft:bowl。
# 可选物品输出可写成 ""、none、null、empty、air、minecraft:air 来清空。

# 语言文件。内置 zh_cn / en_us。
language: zh_cn

# 调试日志。正常使用请保持关闭。
debug:
  enabled: false
  # 可用示例: interact-probe, stove, skillet, storage, all
  categories:
    - interact-probe
    - stove
    - skillet

# 进度系统。关闭后不会同步内置进度数据包。
advancements:
  enabled: true

# 方块数据自动保存间隔，单位秒。
storage:
  auto-save-interval: 300

# 漏斗与插件方块的原版容器交互。
# 当前 CraftEngine 26.x 的方块容器桥接仍在适配中，默认关闭以避免漏斗吞物品或写入异常。
hopper-interactions:
  enabled: false
  cooking-pot: true
  cutting-board: true

# 砧板交互。
cutting-board:
  # 原模组默认只处理主手工具。开启后允许副手小刀 + 主手物品，或主手小刀 + 副手物品。
  allow-offhand-interactions: false

# 小刀识别。建议同时保留标签和具体物品，标签用于 CE 资源侧扩展，具体物品用于兜底。
knife-config:
  tags:
    - farmersdelight:knives
  items:
    - farmersdelight:flint_knife
    - farmersdelight:iron_knife
    - farmersdelight:golden_knife
    - farmersdelight:diamond_knife
    - farmersdelight:netherite_knife

# 厨锅作为物品掉落时是否保存内部内容，并用耐久条显示内容量。
cooking-pot-packed-drop:
  enabled: true
  durability-bar:
    enabled: true
  hide-advanced-durability-tooltip:
    # 开启后隐藏“耐久度: x / y”这种高级提示，只保留本插件的内容描述。
    enabled: true

# 厨锅烹饪中的悬浮显示。
cooking-pot-progress-display:
  # false 只显示进度/状态；true 会额外显示正在烹饪的配方名。
  show-recipe-name: false

# 热源判定。厨锅和煎锅都会用到，煎锅的漏斗导热可单独关闭。
heat-sources:
  # CraftEngine 自定义方块标签。CE 方块配置里给方块加上该 tag 后会被视为热源。
  tags:
    - farmersdelight:heat_sources
  # 原版方块 ID。
  vanilla-blocks:
    - minecraft:magma_block
    - minecraft:lava_cauldron
    - minecraft:lava
    - minecraft:fire
    - minecraft:soul_fire
  # 原版方块标签。minecraft:campfires 会只接受已点燃的营火。
  vanilla-tags:
    - minecraft:campfires
  # CraftEngine 自定义方块 ID，可带状态条件。
  custom-blocks:
    - farmersdelight:stove[fire:true]
  # 原版导热方块。厨锅可隔着这些方块找热源。
  conductors:
    - minecraft:hopper
  # CraftEngine 导热方块标签。
  conductor-tags: []
  skillet:
    # 原模组煎锅不通过漏斗传导热量，默认关闭。
    allow-conductors: false

# 厨锅打开时自动放置的托盘家具，用于承载 CE 显示效果。
tray:
  enabled: true
  tray-block-id: farmersdelight:tray
  x-offset: 0.5
  y-offset: -1.0
  z-offset: 0.5
  require-non-full-support: true
  sync-interval-ticks: 100
  sync-batch-size: 32
  marker-key: auto_tray_marker

# 厨锅世界粒子效果。
cooking-pot-effects:
  bubble:
    enabled: true
    type: BUBBLE_POP
    chance: 0.20
    count: 1
    y-offset: 0.02
    offset-x: 0.0
    offset-y: 0.0
    offset-z: 0.0
    speed: 0.01
  steam:
    enabled: true
    type: CLOUD
    chance: 0.05
    count: 1
    y-offset: 0.08
    offset-x: 0.0
    offset-y: 0.03
    offset-z: 0.0
    speed: 0.02
    secondary:
      enabled: false
      type: SMOKE
      count: 1
      y-offset: 0.05
      offset-x: 0.0
      offset-y: 0.025
      offset-z: 0.0
      speed: 0.02

# 使用小刀击杀成年生物时的额外掉落。
# normal 是普通掉落，burning 是目标燃烧时的掉落，chance 是基础概率，looting-multiplier 是每级抢夺增加概率。
knife-drops:
  pig:
    normal: farmersdelight:ham
    burning: farmersdelight:smoked_ham
    chance: 0.5
    looting-multiplier: 0.1
  hoglin:
    normal: farmersdelight:ham
    burning: farmersdelight:smoked_ham
    chance: 0.5
    looting-multiplier: 0.1
  cow:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  mooshroom:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  donkey:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  horse:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  mule:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  llama:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  trader_llama:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  chicken:
    normal: minecraft:feather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  spider:
    normal: minecraft:string
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  cave_spider:
    normal: minecraft:string
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  rabbit:
    normal: minecraft:rabbit_hide
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  shulker:
    normal: minecraft:shulker_shell
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0

# 使用小刀破坏草、成熟小麦、成熟水稻时额外掉落草秆。
straw-drops:
  short_grass:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2
  tall_grass:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2
  mature_wheat:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2
  mature_rice:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2

# 宠物食物。玩家右键对应实体时给予效果，可继续按同格式添加更多食物。
pet-foods:
  farmersdelight:dog_food:
    entities:
      - WOLF
    require-tamed: true
    restore-health: true
    effects:
      - type: SPEED
        duration: 6000
        amplifier: 0
        ambient: false
        particles: true
      - type: STRENGTH
        duration: 6000
        amplifier: 0
        ambient: false
        particles: true
    sound: ENTITY_GENERIC_EAT
    sound-volume: 0.8
    sound-pitch: 0.8
    particles: true
    particle-type: END_ROD
    particle-count: 5

# 营养效果。默认关闭；开启后吃下列表食物会给玩家 Nourishment。
nourishment-foods:
  enabled: false
  foods:
    farmersdelight:noodle_soup:
      duration: 300
    farmersdelight:vegetable_noodles:
      duration: 300
    farmersdelight:beef_stew:
      duration: 300
    farmersdelight:chicken_soup:
      duration: 300
    farmersdelight:vegetable_soup:
      duration: 300
    farmersdelight:fish_stew:
      duration: 300
    farmersdelight:fried_rice:
      duration: 300

# 食物吃完或厨锅消耗容器后返还的物品。
# 例如牛奶瓶被消耗后返还玻璃瓶。写 "" 可禁用某一项返还。
container-returns:
  farmersdelight:milk_bottle: minecraft:glass_bottle

# 世界中显示物品的缩放。
display-visuals:
  skillet:
    scale: 0.5
  stove:
    scale: 0.375
